[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "file-transfer"
version = "0.2.0"
description = "Local HTTPS file drop: send files from a phone to this machine"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = [
    "multipart==1.3.0",
    "cryptography>=42",
    "qrcode>=7.4",
]

[project.scripts]
file-transfer = "filetransfer.cli:main"

[tool.setuptools]
packages = ["filetransfer"]
